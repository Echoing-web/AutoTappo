<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoTappo · 鸣潮桌宠后台挂机助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- 顶部标题栏 -->
    <header class="app-header">
      <div class="logo-area">
        <img src="logo.png" alt="AutoTappo Logo" class="app-logo">
        <div class="logo-text">
          <h1>AutoTappo</h1>
          <span class="sub-title">WuwaTappo 智能挂机</span>
        </div>
      </div>
      <!-- 右上角铃铛更新按钮 -->
      <button id="btn-bell" class="icon-btn bell-btn" title="检查更新与版本信息">
        <span class="bell-icon">🔔</span>
        <span class="update-dot" id="update-dot"></span>
      </button>
    </header>

    <!-- 核心状态卡片 -->
    <section class="status-card">
      <div class="pulse-ring" id="status-ring"></div>
      <div class="status-content">
        <span class="status-badge" id="status-badge">已暂停</span>
        <div class="sent-counter">
          <span class="counter-label">本次模拟点击</span>
          <div class="counter-row">
            <span class="counter-value" id="counter-value">0</span>
            <button id="btn-reset" class="mini-btn" title="清零本次计数">↺</button>
          </div>
        </div>
      </div>
      <button id="btn-toggle" class="main-toggle-btn">
        <span id="btn-toggle-icon">▶</span>
        <span id="btn-toggle-text">开始挂机 (F6)</span>
      </button>
    </section>

    <!-- 速度档位调节 -->
    <section class="control-section">
      <label class="section-label">⚡ 速度档位调节</label>
      <div class="speed-selector">
        <button class="speed-btn active" data-speed="0">
          <span class="speed-title">休闲拟真</span>
          <span class="speed-desc">~10 次/秒 · 办公推荐</span>
        </button>
        <button class="speed-btn" data-speed="1">
          <span class="speed-title">快速进阶</span>
          <span class="speed-desc">~25 次/秒 · 快速刷分</span>
        </button>
        <button class="speed-btn" data-speed="2">
          <span class="speed-title">极速狂暴</span>
          <span class="speed-desc">~50 次/秒 · 极限冲刺</span>
        </button>
      </div>
    </section>

    <!-- 可自定义全局热键胶囊 -->
    <div class="hotkey-pill" id="hotkey-pill">
      <div class="hotkey-left">
        <span class="hotkey-icon">⌨️</span>
        <span class="hotkey-label">全局启停热键</span>
      </div>
      <div class="hotkey-right">
        <button id="btn-hotkey" class="hotkey-badge" title="点击后按键盘任意键设置新快捷键">
          <span id="lbl-hotkey">F6</span>
        </button>
        <span class="hotkey-tip" id="hotkey-tip">点击修改</span>
      </div>
    </div>

    <!-- 底部控制栏 -->
    <footer class="app-footer">
      <button id="btn-hide" class="footer-btn">收进系统托盘</button>
      <button id="btn-quit" class="footer-btn danger">退出程序</button>
    </footer>

    <!-- 更新弹窗 (Modal) -->
    <div class="modal-backdrop" id="update-modal">
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-title-area">
            <span class="modal-icon">🔔</span>
            <h3>版本与更新</h3>
          </div>
          <button class="modal-close-btn" id="btn-modal-close">✕</button>
        </div>

        <div class="modal-body">
          <div class="version-row">
            <span class="v-label">当前运行版本</span>
            <span class="v-val current" id="lbl-cur-version">v0.1.0</span>
          </div>
          <div class="version-row">
            <span class="v-label">最新发布版本</span>
            <span class="v-val latest" id="lbl-latest-version">检测中...</span>
          </div>

          <div class="update-status-box" id="update-status-box">
            <div class="spinner" id="update-spinner" style="display: none;"></div>
            <p id="update-status-text">点击下方按钮获取最新版本信息</p>
          </div>

          <div class="changelog-area" id="changelog-area" style="display: none;">
            <label class="cl-title">新版本亮点：</label>
            <div class="cl-content" id="changelog-content"></div>
          </div>
        </div>

        <div class="modal-footer">
          <button id="btn-check-now" class="modal-btn primary">
            <span id="btn-check-icon">🔄</span>
            <span id="btn-check-text">立即检查更新</span>
          </button>
          <a id="btn-download" class="modal-btn action" href="https://github.com/To0Ru/AutoTappo/releases" target="_blank" style="display: none;">
            前往下载新版 ↗
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（MSVC 工具链 windows-latest 自带）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 缓存 cargo / target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 检查语法 (cargo check)
        run: cargo check --all-targets

      - name: 编译 Release 可执行文件
        run: cargo build --release

      - name: 上传免安装单文件 EXE（任意分支均可直接下载测试）
        uses: actions/upload-artifact@v4
        with:
          name: AutoTappo-Windows-x64-latest
          path: src-tauri/target/release/AutoTappo.exe
          if-no-files-found: error
          retention-days: 30

      # ---------------- 只有打标签 (tag v*) 才构建 NSIS 安装包并发布 Release ---------------- #

      - name: 安装 Node.js（Tauri 打包器使用）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 生成 NSIS 安装包
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx --yes @tauri-apps/cli@^2 build

      - name: 自动发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/AutoTappo.exe
            src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
          draft: false
